# Shape Optimizer Configuration
optimization_type: SA # can be SA, DSA
combination_type: grid # can be grid (cartesian product), zip, lhs
n_lhs_samples: 30 # default = 10
max_processes: 6
database_name: remote-jasminum.db #remote-jasminum.db
table_name: temp_2000_tests # if bool or null, table = x{x}y{y}n{num_ellipses}lambda{linear_pen}_opt{optimization_type}
n_runs: 5 # number of trials per configuration

geometric_params:
  geometric_config:
    x_max: 1.0
    y_max: 1.0
    MW_x: 0.3
    ME_x: 0.7
  h: 0.02
  heat_sources: 10.0
  base_temp: 0.0
  num_ellipses: 4

penalizations:
  linear: 15.0

kwargs_SA:
  initial_temp: 2000
  min_temp: 0.0001
  cooling_rate: [0.995, 0.999]
  perturbation: 
    - [0.07, 0.07, 5.0, 2.0, 5.0]
    - [0.05, 0.05, 3.0, 1.0, 3.0]
    - [0.09, 0.09, 7.0, 3.0, 7.0]
  track_file_name: true
  gen_seed: 0 # 0 = no seed

kwargs_DSA:
  initial_temp: 2000.0
  min_temp: 0.001
  cooling_rate_max: 0.999
  cooling_rate_min: 0.98
  base_markov_length: 5
  num_configs: 20
  initial_perturbation: [0.08, 0.08, 4.0, 6.0, 4.0]
  min_perturbation: [0.008, 0.008, 0.4, 0.6, 0.4]
  perturbation_update: 0.995
  min_cost_gap: 0.01
  track_file_name: true
  gen_seed: 0 # 0 = no seed